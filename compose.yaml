services:
  postgres:
    image: postgres:16-alpine
    container_name: autoservice-db
    environment:
      POSTGRES_DB: autoservice
      POSTGRES_USER: autoservice
      POSTGRES_PASSWORD: autoservice
    ports:
      - "5434:5432"
    volumes:
      - autoservice-pg-data:/var/lib/postgresql/data
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoservice -d autoservice"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  autoservice-pg-data:
